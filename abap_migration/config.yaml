# PySpark Data Quality Framework Configuration

# Spark Configuration
spark:
  app_name: "ETL Data Quality Framework"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.default.parallelism: 8
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"

# Data Quality Configuration
data_quality:
  # Required fields that must not be null/empty
  required_fields:
    - id
    - name
    - value
    - category
    - status
  
  # ID field for uniqueness checks
  id_field: "id"
  
  # Validity rules
  validity_rules:
    # Allowed status values
    allowed_statuses:
      - ACTIVE
      - INACTIVE
      - TRANSFORMED
      - HIGH_VALUE
      - MEDIUM_VALUE
      - LOW_VALUE
      - NORMAL
      - INVALID
    
    # Allowed categories
    allowed_categories:
      - PREMIUM
      - STANDARD
      - BASIC
      - VIP
      - TRIAL
      - UNCATEGORIZED
    
    # Value ranges
    value_ranges:
      min_value: 0
      max_value: 100000
    
    # Priority range
    priority_range:
      min: 1
      max: 5
  
  # Business rules validation
  business_rules:
    # Check premium category transformation
    premium_multiplier_check: true
    premium_multiplier: 1.5
    
    # Check priority-value consistency
    priority_value_check: true
    high_priority_threshold: 1000
    
    # Check ETL run ID presence
    run_id_check: true
    
    # Status-value consistency
    status_value_check: true
    high_value_threshold: 750
    medium_value_threshold: 300
  
  # Anomaly detection settings
  anomaly_detection:
    enabled: true
    outlier_std_dev_threshold: 3
    max_category_percentage: 50
    check_future_dates: true
  
  # Profiling settings
  profiling:
    enabled: true
    calculate_statistics: true
    include_distributions: true

# Database Configuration
database:
  source:
    jdbc_url: "jdbc:postgresql://localhost:5432/etl_source"
    driver: "org.postgresql.Driver"
    table: "source_data"
    user: "etl_user"
    password: "${DB_PASSWORD}"
  
  target:
    jdbc_url: "jdbc:postgresql://localhost:5432/etl_target"
    driver: "org.postgresql.Driver"
    table: "target_data"
    user: "etl_user"
    password: "${DB_PASSWORD}"

# Logging Configuration
logging:
  level: "INFO"
  format: "[%(asctime)s] %(levelname)s - %(name)s - %(message)s"
  file: "logs/data_quality_{run_id}.log"
  console: true

# Reporting Configuration
reporting:
  output_path: "reports/quality_reports"
  format: "json"
  include_details: true
  generate_summary: true

# Schema Definitions
schemas:
  source_data:
    fields:
      - name: id
        type: string
        nullable: false
      - name: name
        type: string
        nullable: false
      - name: value
        type: decimal(15,2)
        nullable: false
      - name: status
        type: string
        nullable: true
      - name: category
        type: string
        nullable: true
      - name: source_system
        type: string
        nullable: true
      - name: created_at
        type: timestamp
        nullable: true
      - name: created_by
        type: string
        nullable: true
      - name: changed_at
        type: timestamp
        nullable: true
      - name: changed_by
        type: string
        nullable: true
  
  transformed_data:
    fields:
      - name: id
        type: string
        nullable: false
      - name: name
        type: string
        nullable: false
      - name: value
        type: decimal(15,2)
        nullable: false
      - name: transformed_value
        type: decimal(15,2)
        nullable: false
      - name: status
        type: string
        nullable: false
      - name: category
        type: string
        nullable: false
      - name: priority
        type: integer
        nullable: false
      - name: etl_run_id
        type: string
        nullable: false
      - name: processed_at
        type: timestamp
        nullable: false
      - name: processed_by
        type: string
        nullable: false