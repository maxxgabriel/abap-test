# ETL Configuration
spark:
  app_name: "ETL_Data_Extractor"
  master: "local[*]"
  log_level: "WARN"
  
delta_lake:
  enabled: true
  catalog_name: "spark_catalog"
  warehouse_path: "/opt/spark/warehouse"
  checkpoint_location: "/opt/spark/checkpoints"
  
source:
  type: "database"  # database, staging, incremental
  database:
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    table: "etl_source_data"
    user: "etl_user"
    password: "etl_password"
  staging:
    path: "/data/staging"
    format: "parquet"
  delta:
    path: "/data/delta/source"
    
extraction:
  default_max_records: 1000
  batch_size: 1000
  filter_column: "status"
  timestamp_column: "changed_at"
  incremental:
    watermark_delay: "10 minutes"
    
target:
  type: "database"  # database, delta
  database:
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    table: "etl_target_data"
    user: "etl_user"
    password: "etl_password"
  delta:
    path: "/data/delta/target"
    partition_columns: ["category", "status"]
    optimize_interval: "daily"
    
transformation:
  premium_multiplier: 1.5
  high_value_threshold: 750
  medium_value_threshold: 300
  priority_override_threshold: 1000
  
quality:
  enable_checks: true
  fail_on_error: false
  checks:
    - name: "completeness"
      enabled: true
    - name: "uniqueness"
      enabled: true
    - name: "validity"
      enabled: true
    - name: "consistency"
      enabled: true
      
monitoring:
  enable_metrics: true
  dashboard_days: 7
  alert_email: "admin@example.com"
  health_check_interval: 300
  
logging:
  level: "INFO"
  format: "[%(asctime)s] %(levelname)s: %(component)s - %(message)s"
  file: "/logs/etl_execution.log"
  retention_days: 90