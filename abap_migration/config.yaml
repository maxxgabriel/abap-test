# ETL Logger Configuration

logger:
  # Log levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
  default_level: INFO
  
  # Console output settings
  console:
    enabled: true
    format: "%(asctime)s - %(levelname)s - %(name)s - %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"
  
  # In-memory storage settings
  storage:
    max_entries: 10000  # Maximum number of log entries to store
    auto_clear: false    # Automatically clear old entries when limit reached
  
  # Component-specific settings
  components:
    EXTRACTOR:
      level: INFO
      enabled: true
    
    TRANSFORMER:
      level: INFO
      enabled: true
    
    LOADER:
      level: INFO
      enabled: true
    
    ORCHESTRATOR:
      level: INFO
      enabled: true
    
    DATA_QUALITY:
      level: INFO
      enabled: true
    
    MONITOR:
      level: WARNING
      enabled: true

# ETL Process Configuration
etl:
  batch_size: 1000
  max_retries: 3
  timeout_seconds: 3600
  
  # Source configuration
  source:
    type: DATABASE
    format: parquet
    
  # Target configuration
  target:
    type: DATABASE
    format: parquet
    mode: overwrite

# Spark Configuration
spark:
  app_name: ETL_Logger_Application
  master: local[*]
  config:
    spark.sql.shuffle.partitions: 200
    spark.executor.memory: 4g
    spark.driver.memory: 2g
    spark.sql.adaptive.enabled: true

# Monitoring and Alerts
monitoring:
  enabled: true
  alert_on_error: true
  alert_threshold: 5  # Number of errors before alerting
  
  health_check:
    enabled: true
    interval_seconds: 300

# Data Quality Rules
data_quality:
  enabled: true
  checks:
    - completeness
    - uniqueness
    - validity
    - consistency
  
  failure_action: warn  # Options: warn, fail, ignore