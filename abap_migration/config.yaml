# PySpark ETL Pipeline Configuration

# Spark Configuration
spark:
  app_name: "ETL_Transformation_Pipeline"
  master: "local[*]"
  log_level: "WARN"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.sql.files.maxPartitionBytes: "134217728"  # 128MB

# Source Configuration
source:
  type: "database"  # database, staging, incremental
  format: "jdbc"
  jdbc:
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    table: "source_data"
    user: "etl_user"
    password: "etl_password"
  filter: null
  max_records: 0  # 0 means no limit
  
# Transformation Configuration
transformation:
  batch_size: 1000
  rules:
    category_multipliers:
      PREMIUM: 1.5
      STANDARD: 1.0
      BASIC: 0.8
      VIP: 2.0
      TRIAL: 0.5
    priority_thresholds:
      high: 1000
      medium: 750
      low: 300
    status_mapping:
      high_value: 750
      medium_value: 300

# Target Configuration
target:
  type: "database"
  format: "jdbc"
  jdbc:
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    table: "target_data"
    user: "etl_user"
    password: "etl_password"
  mode: "upsert"  # insert, update, upsert
  batch_size: 1000

# Data Quality Configuration
quality:
  enabled: true
  checks:
    completeness: true
    uniqueness: true
    validity: true
    consistency: true
  thresholds:
    error_rate_warning: 0.05  # 5%
    error_rate_critical: 0.10  # 10%

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_pipeline.log"
  console: true

# Monitoring Configuration
monitoring:
  enabled: true
  metrics_enabled: true
  health_check_interval: 60  # seconds

# Performance Configuration
performance:
  cache_intermediate: true
  repartition_enabled: true
  repartition_columns: ["category"]
  num_partitions: 10