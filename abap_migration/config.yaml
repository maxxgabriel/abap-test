# ETL Data Quality Configuration

# Spark Configuration
spark:
  app_name: "ETL_Data_Quality_Pipeline"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"

# Data Quality Thresholds
quality_thresholds:
  min_records: 1
  max_records: 1000000
  max_null_percentage: 10.0
  max_pipeline_loss_pct: 5.0
  max_duplicate_percentage: 1.0

# Required Fields for Completeness Check
required_fields:
  - id
  - name
  - value
  - category
  - status

# ID Field Configuration
id_field: "id"

# Profiling Configuration
profiling:
  enabled: true
  include_column_stats: true
  detect_anomalies: true
  outlier_std_threshold: 3.0

# Validation Rules
validation_rules:
  value:
    min: 0
    max: 1000000
  transformed_value:
    min: 0
    max: 1500000
  priority:
    min: 1
    max: 5
  category:
    allowed_values:
      - PREMIUM
      - STANDARD
      - BASIC
      - VIP
      - TRIAL
      - UNCATEGORIZED

# Consistency Rules
consistency_rules:
  premium_multiplier: 1.2
  high_value_threshold: 750
  very_high_value_threshold: 1000

# Anomaly Detection
anomaly_detection:
  enabled: true
  outlier_detection: true
  category_distribution_check: true
  null_pattern_check: true
  min_category_percentage: 1.0
  max_category_percentage: 80.0

# Pipeline Count Validation
pipeline_validation:
  enabled: true
  track_counts: true
  validate_stage_transitions: true

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
# Test Configuration
test:
  sample_data_size: 100
  test_run_prefix: "TEST_"
  mock_data: true