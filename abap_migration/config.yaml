# Delta Lake Loader Configuration

# Spark Configuration
spark:
  app_name: "ETL_Delta_Loader"
  master: "local[*]"
  log_level: "INFO"
  configs:
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.databricks.delta.retentionDurationCheck.enabled: "false"
    spark.databricks.delta.schema.autoMerge.enabled: "true"

# Loader Configuration
loader:
  batch_size: 1000
  target_path: "/data/delta/target_table"
  enable_reconciliation: true
  compact_on_complete: false
  vacuum_retention_hours: 168  # 7 days
  
# Source Configuration
source:
  format: "parquet"
  path: "/data/transformed"
  
# Performance Tuning
performance:
  shuffle_partitions: 200
  max_records_per_file: 100000
  file_size_mb: 128
  
# Data Quality
quality:
  enable_validation: true
  duplicate_check: true
  null_check: true
  
# Monitoring
monitoring:
  enable_metrics: true
  log_retention_days: 90
  alert_email: "admin@example.com"
  
# Error Handling
error_handling:
  max_retries: 3
  retry_delay_seconds: 30
  continue_on_error: false
  error_path: "/data/errors"

# Load Modes
# Options: insert, update, upsert, overwrite
default_load_mode: "upsert"

# Partitioning Strategy
partitioning:
  enabled: true
  columns:
    - "category"
  
# Schema Management
schema:
  enforce_schema: true
  merge_schema: true
  validate_on_write: true