# ETL Logger Configuration
logging:
  level: INFO
  format: "[%(asctime)s] %(levelname)s: %(component)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
  # In-memory storage settings
  storage:
    max_entries: 10000  # Maximum log entries to retain in memory
    auto_clear: false   # Automatically clear logs after export
    
  # Log rotation (for future file-based implementation)
  rotation:
    enabled: false
    max_bytes: 10485760  # 10 MB
    backup_count: 5

# Component names for standardization
components:
  extractor: EXTRACTOR
  transformer: TRANSFORMER
  loader: LOADER
  orchestrator: ORCHESTRATOR
  data_quality: DATA_QUALITY
  monitor: MONITOR

# Log levels mapping
log_levels:
  debug: DEBUG
  info: INFO
  warning: WARNING
  error: ERROR
  critical: CRITICAL

# ETL Process Configuration
etl:
  default_batch_size: 1000
  max_retries: 3
  timeout_seconds: 3600
  
  # Performance monitoring
  monitoring:
    enabled: true
    log_performance_metrics: true
    alert_on_error_threshold: 10

# Testing Configuration
testing:
  mock_data_rows: 100
  test_run_prefix: "TEST"
  enable_debug_logs: true