# ETL Data Initialization Configuration

init_data:
  sample_rows: 100
  categories:
    - PREMIUM
    - STANDARD
    - BASIC
    - VIP
    - TRIAL
  value_range:
    min: 50
    max: 1000

spark:
  app_name: ETL_Data_Initializer
  master: local[*]
  configs:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.default.parallelism: 8
    spark.driver.memory: 2g
    spark.executor.memory: 4g

database:
  format: parquet
  source_data_path: data/source_data
  config_data_path: data/config_data
  schedule_data_path: data/schedule_data
  category_metadata_path: data/category_metadata
  checkpoint_location: /tmp/etl_checkpoints
  write_mode: overwrite

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

validation:
  max_null_percentage: 5.0
  min_unique_ids: 90.0
  value_range:
    min: 0
    max: 10000