# ETL Configuration File

# Source Configuration
source:
  type: database
  connection:
    host: localhost
    port: 5432
    database: etl_source
  table: source_data
  max_records: 1000

# Target Configuration
target:
  type: database
  connection:
    host: localhost
    port: 5432
    database: etl_target
  table: target_data
  mode: upsert

# Processing Configuration
processing:
  batch_size: 1000
  max_retries: 3
  enable_validation: true
  enable_reconciliation: true
  
# Transformation Rules
transformation:
  premium_multiplier: 1.5
  standard_multiplier: 1.2
  categories:
    - PREMIUM
    - STANDARD
    - BASIC
    - VIP
    - TRIAL

# Quality Checks
data_quality:
  enable_completeness_check: true
  enable_uniqueness_check: true
  enable_validity_check: true
  enable_consistency_check: true
  max_error_threshold: 5.0

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_dir: logs
  retention_days: 90

# Monitoring Configuration
monitoring:
  enable_alerts: true
  alert_email: admin@example.com
  alert_threshold:
    error_rate: 20.0
    max_running_jobs: 5
  dashboard_refresh_seconds: 300

# Performance Configuration
performance:
  spark_master: local[*]
  executor_memory: 4g
  driver_memory: 2g
  executor_cores: 4
  shuffle_partitions: 200