# ETL Logger Configuration

logger:
  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO
  
  # Enable console output
  console_output: true
  
  # Maximum number of logs to keep in memory
  max_logs: 10000
  
  # Log export settings
  export:
    enabled: false
    format: json  # text or json
    filepath: /tmp/etl_logs.json
    auto_export: false
    export_interval_minutes: 60

# Component-specific settings
components:
  extractor:
    log_level: INFO
    verbose: true
  
  transformer:
    log_level: INFO
    verbose: true
  
  loader:
    log_level: INFO
    verbose: true
  
  orchestrator:
    log_level: INFO
    verbose: true
  
  data_quality:
    log_level: INFO
    verbose: true

# Performance settings
performance:
  thread_safe: true
  buffer_size: 1000
  flush_interval_seconds: 10

# Alert settings
alerts:
  error_threshold: 10
  warning_threshold: 50
  alert_on_error: false
  alert_email: admin@example.com

# Retention settings
retention:
  auto_cleanup: true
  retention_days: 7
  cleanup_interval_hours: 24