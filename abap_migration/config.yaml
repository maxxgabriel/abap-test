# ETL Configuration

# Spark Configuration
spark:
  app_name: "ETL_Orchestrator"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

# Source Configuration
source:
  type: "DATABASE"
  database: "etl_source_db"
  table: "etl_source_data"
  filter: null
  max_records: 0

# Target Configuration
target:
  type: "DATABASE"
  database: "etl_target_db"
  table: "etl_target_data"
  mode: "UPSERT"

# Processing Configuration
processing:
  batch_size: 1000
  max_retries: 3
  retry_delay_seconds: 5
  enable_validation: true
  enable_reconciliation: true

# Transformation Rules
transformation:
  premium_multiplier: 1.5
  standard_multiplier: 1.2
  vip_multiplier: 2.0
  basic_multiplier: 1.0

# Quality Checks
quality:
  enabled: true
  check_completeness: true
  check_uniqueness: true
  check_validity: true
  check_consistency: true
  fail_on_quality_issues: false

# Monitoring
monitoring:
  enabled: true
  alert_on_failure: true
  alert_email: "admin@example.com"
  health_check_interval_seconds: 300

# Logging
logging:
  level: "INFO"
  retention_days: 90
  log_to_file: true
  log_directory: "/var/log/etl"

# Run Types
run_types:
  - MANUAL
  - SCHEDULED
  - TEST
  - INCREMENTAL

# Status Values
statuses:
  - RUNNING
  - SUCCESS
  - FAILED
  - PARTIAL_SUCCESS
  - ERROR
  - NO_DATA
  - VALIDATION_FAILED