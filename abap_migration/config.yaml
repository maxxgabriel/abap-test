# ETL Monitoring Configuration

monitoring:
  # Data paths
  paths:
    run_logs: "data/monitoring/run_logs"
    error_logs: "data/monitoring/error_logs"
    alerts: "data/monitoring/alerts"
    metrics_output: "data/monitoring/reports"
  
  # Dashboard settings
  dashboard:
    default_days_back: 7
    refresh_interval_seconds: 60
    max_running_jobs_threshold: 5
  
  # Health check thresholds
  health_check:
    critical_error_rate: 50.0  # percentage
    warning_error_rate: 20.0   # percentage
    max_running_jobs: 5
    min_throughput: 100.0      # records per second
  
  # Alert settings
  alerts:
    enabled: true
    email_recipients:
      - "admin@example.com"
      - "etl-team@example.com"
    severity_levels:
      - "LOW"
      - "MEDIUM"
      - "HIGH"
      - "CRITICAL"
    alert_types:
      - "PERFORMANCE"
      - "ERROR_RATE"
      - "DATA_QUALITY"
      - "SYSTEM"
  
  # Metrics aggregation
  metrics:
    time_buckets:
      - "hour"
      - "day"
      - "week"
    retention_days: 90
    export_formats:
      - "parquet"
      - "csv"
      - "json"
  
  # Performance monitoring
  performance:
    track_throughput: true
    track_duration: true
    track_memory_usage: true
    percentiles:
      - 50
      - 90
      - 95
      - 99
  
  # Error tracking
  error_tracking:
    include_resolved: false
    max_errors_displayed: 100
    group_by_component: true
    group_by_type: true

# Spark configuration for monitoring
spark:
  app_name: "ETL_Monitoring"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.session.timeZone: "UTC"
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_monitoring.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5