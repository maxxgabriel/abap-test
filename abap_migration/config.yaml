# ETL Test Framework Configuration

# Spark Configuration
spark:
  app_name: "etl_test_framework"
  master: "local[2]"
  configs:
    spark.sql.shuffle.partitions: 2
    spark.default.parallelism: 2
    spark.ui.enabled: false
    spark.driver.memory: "1g"
    spark.sql.adaptive.enabled: true

# Test Data Generation
test_data:
  default_record_count: 100
  include_nulls: false
  include_duplicates: false
  include_invalid: false
  categories:
    - PREMIUM
    - STANDARD
    - BASIC
    - VIP
    - TRIAL
  value_range:
    min: 50
    max: 1000

# Test Execution
test_execution:
  batch_size: 100
  max_retries: 3
  timeout_seconds: 300
  enable_parallel: false

# Test Data Storage
storage:
  format: "parquet"
  temp_dir: "/tmp/spark_test"
  cleanup_on_exit: true

# Logging
logging:
  level: "INFO"
  log_to_file: false
  log_dir: "logs/test"

# Assertions
assertions:
  strict_schema_validation: true
  enable_row_comparison: true
  compare_decimals_precision: 2

# Mock Data Sources
mock_sources:
  database:
    enabled: true
    auto_register: true
  
  staging:
    enabled: true
    auto_register: true

# Quality Checks
quality_checks:
  completeness:
    enabled: true
    critical_fields:
      - id
      - name
      - value
  
  uniqueness:
    enabled: true
    key_fields:
      - id
  
  validity:
    enabled: true
    rules:
      - field: value
        min: 0
      - field: priority
        min: 1
        max: 5

# Test Scenarios
scenarios:
  unit_test:
    record_count: 10
    batch_size: 5
  
  integration_test:
    record_count: 100
    batch_size: 50
  
  load_test:
    record_count: 10000
    batch_size: 1000