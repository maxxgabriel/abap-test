# Shared Framework Configuration
app:
  name: "ETL Shared Framework"
  version: "1.0.0"
  environment: "production"

logging:
  level: "INFO"
  format: "json"
  console_output: true
  file_output: true
  log_dir: "/var/log/etl"
  max_file_size_mb: 100
  backup_count: 10
  components:
    - "EXTRACTOR"
    - "TRANSFORMER"
    - "LOADER"
    - "ORCHESTRATOR"
    - "DATA_QUALITY"
    - "MONITOR"

database:
  source:
    type: "postgresql"
    host: "${SOURCE_DB_HOST}"
    port: 5432
    database: "${SOURCE_DB_NAME}"
    user: "${SOURCE_DB_USER}"
    password: "${SOURCE_DB_PASSWORD}"
    schema: "etl_source"
    connection_pool:
      max_connections: 20
      min_connections: 5
      connection_timeout: 30
      idle_timeout: 600
  
  target:
    type: "postgresql"
    host: "${TARGET_DB_HOST}"
    port: 5432
    database: "${TARGET_DB_NAME}"
    user: "${TARGET_DB_USER}"
    password: "${TARGET_DB_PASSWORD}"
    schema: "etl_target"
    connection_pool:
      max_connections: 20
      min_connections: 5
      connection_timeout: 30
      idle_timeout: 600

spark:
  app_name: "ETL_Shared_Framework"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.default.parallelism: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.executor.cores: "4"
    spark.sql.warehouse.dir: "/opt/spark/warehouse"

etl:
  batch_size: 1000
  max_retries: 3
  retry_delay_seconds: 5
  enable_reconciliation: true
  enable_data_quality: true
  max_records_per_run: 0  # 0 = unlimited
  
monitoring:
  enable_metrics: true
  metrics_port: 9090
  dashboard_refresh_seconds: 30
  health_check_interval_seconds: 60
  alert_email: "admin@example.com"
  alert_thresholds:
    error_rate_percent: 20
    critical_error_rate_percent: 50
    max_concurrent_jobs: 5

data_quality:
  enable_profiling: true
  enable_anomaly_detection: true
  completeness_threshold: 95
  uniqueness_threshold: 100
  validity_threshold: 98
  consistency_threshold: 95

performance:
  enable_caching: true
  cache_timeout_minutes: 60
  enable_compression: true
  compression_codec: "snappy"