# ETL Logger Configuration

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "[%(asctime)s] %(levelname)s: %(component)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
  # In-memory storage settings
  max_log_entries: 10000  # Maximum number of logs to keep in memory
  auto_clear: false  # Automatically clear logs after export
  
  # Export settings
  export_format: json  # json or csv
  export_path: /tmp/etl_logs  # Path for log exports
  
  # Component-specific settings
  components:
    EXTRACTOR:
      level: INFO
      enabled: true
    TRANSFORMER:
      level: INFO
      enabled: true
    LOADER:
      level: INFO
      enabled: true
    ORCHESTRATOR:
      level: INFO
      enabled: true
    DATA_QUALITY:
      level: WARNING
      enabled: true
    MONITOR:
      level: INFO
      enabled: true

  # Log retention
  retention:
    enabled: true
    days: 90

  # Alert thresholds
  alerts:
    error_threshold: 10  # Alert after N errors
    warning_threshold: 50  # Alert after N warnings
    enabled: true