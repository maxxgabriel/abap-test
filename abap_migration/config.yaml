# Data Quality Configuration

spark:
  app_name: "DataQualityValidation"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.sql.shuffle.partitions: 200
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

data_quality:
  # Critical fields that must not be null
  critical_fields:
    - id
    - name
    - value
    - category
  
  # Field used for uniqueness checks
  id_field: "id"
  
  # Validation rules
  validation_rules:
    positive_fields:
      - value
      - transformed_value
    priority_range:
      min: 1
      max: 5
    required_fields:
      - id
      - name
      - status
      - category
  
  # Thresholds for validation
  thresholds:
    record_count:
      min: 10
      max: 1000000
      expected: 100000
      tolerance_percent: 10.0
    
    null_percentage:
      max: 5.0  # Maximum 5% null values
    
    duplicate_percentage:
      max: 1.0  # Maximum 1% duplicates
    
    error_rate:
      max: 5.0  # Maximum 5% error rate
    
    completeness:
      min: 95.0  # Minimum 95% completeness
  
  # Anomaly detection settings
  anomaly_detection:
    enabled: true
    std_threshold: 3.0  # Number of standard deviations
    outlier_percentage_threshold: 5.0
  
  # Profiling settings
  profiling:
    enabled: true
    sample_size: 10000  # Sample size for profiling
    generate_histograms: true
    histogram_buckets: 20

# Data source configuration
data_sources:
  source_table: "etl_source_data"
  target_table: "etl_target_data"
  staging_table: "etl_staging"
  
  # Schema definitions
  source_schema:
    - name: "id"
      type: "string"
      nullable: false
    - name: "name"
      type: "string"
      nullable: false
    - name: "value"
      type: "double"
      nullable: false
    - name: "status"
      type: "string"
      nullable: true
    - name: "category"
      type: "string"
      nullable: false
    - name: "source_system"
      type: "string"
      nullable: true
    - name: "created_at"
      type: "timestamp"
      nullable: true

  target_schema:
    - name: "id"
      type: "string"
      nullable: false
    - name: "name"
      type: "string"
      nullable: false
    - name: "value"
      type: "double"
      nullable: false
    - name: "transformed_value"
      type: "double"
      nullable: false
    - name: "status"
      type: "string"
      nullable: false
    - name: "category"
      type: "string"
      nullable: false
    - name: "priority"
      type: "integer"
      nullable: false
    - name: "etl_run_id"
      type: "string"
      nullable: false
    - name: "processed_at"
      type: "timestamp"
      nullable: false

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/data_quality.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Alert configuration
alerts:
  enabled: true
  email:
    smtp_server: "smtp.example.com"
    smtp_port: 587
    from_address: "etl-alerts@example.com"
    to_addresses:
      - "admin@example.com"
      - "data-team@example.com"
  
  slack:
    enabled: false
    webhook_url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  
  # Conditions for sending alerts
  conditions:
    - check_type: "COMPLETENESS"
      severity: "CRITICAL"
    - check_type: "THRESHOLD"
      severity: "CRITICAL"
    - error_rate_threshold: 10.0

# Reporting configuration
reporting:
  output_path: "reports/quality_reports"
  format: "json"  # json, html, or csv
  include_details: true
  generate_charts: false