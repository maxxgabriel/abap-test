# ETL Loader Configuration

# Target Configuration
target_type: "DATABASE"  # DATABASE, PARQUET, DELTA
target_table: "etl_target_data"
target_path: "/data/output/target"

# Database Configuration
jdbc_url: "jdbc:postgresql://localhost:5432/etl_db"
db_user: "etl_user"
db_password: "${DB_PASSWORD}"  # Use environment variable
db_driver: "org.postgresql.Driver"

# Batch Processing
batch_size: 1000
max_retries: 3
retry_delay_seconds: 5

# Load Modes
default_load_mode: "UPSERT"  # INSERT, UPDATE, UPSERT
enable_reconciliation: true

# Performance Settings
num_partitions: 10
write_parallelism: 4
buffer_size_mb: 64

# Error Handling
error_table: "etl_error_log"
continue_on_error: false
max_error_threshold: 100

# Logging
log_level: "INFO"
log_batch_progress: true
log_retention_days: 90

# Metadata
add_load_timestamp: true
add_run_id: true
add_source_info: true

# Validation
validate_before_load: true
validate_after_load: true
data_quality_checks:
  - check_duplicates
  - check_nulls
  - check_data_types

# Spark Configuration
spark:
  app_name: "ETL_Loader"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"