# Shared Framework Configuration
spark:
  app_name: "ETL_Framework"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.dynamicAllocation.enabled: true
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.executor.cores: 4
    spark.sql.sources.partitionOverwriteMode: "dynamic"

database:
  source:
    jdbc_url: "jdbc:postgresql://localhost:5432/source_db"
    driver: "org.postgresql.Driver"
    user: "etl_user"
    password_env: "DB_SOURCE_PASSWORD"
    connection_properties:
      fetchsize: 10000
      batchsize: 10000
  
  target:
    jdbc_url: "jdbc:postgresql://localhost:5432/target_db"
    driver: "org.postgresql.Driver"
    user: "etl_user"
    password_env: "DB_TARGET_PASSWORD"
    connection_properties:
      batchsize: 10000
      reWriteBatchedInserts: true

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "logs/etl_framework.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
  console:
    enabled: true
  database:
    enabled: true
    table: "etl_run_log"

etl:
  batch_size: 1000
  max_retries: 3
  retry_delay_seconds: 5
  validation_enabled: true
  reconciliation_enabled: true
  quality_checks_enabled: true
  
quality:
  completeness_threshold: 0.95
  uniqueness_check: true
  validity_rules:
    - field: "value"
      type: "range"
      min: 0
      max: 1000000
    - field: "priority"
      type: "range"
      min: 1
      max: 5

monitoring:
  health_check_interval_seconds: 300
  alert_email: "admin@example.com"
  dashboard_retention_days: 30
  error_threshold_percent: 20
  
performance:
  cache_intermediate_results: true
  checkpoint_enabled: true
  checkpoint_interval: 100
  repartition_size: 200

paths:
  staging: "/tmp/etl_staging"
  checkpoint: "/tmp/etl_checkpoint"
  output: "/tmp/etl_output"