# ETL Loading Configuration

# Spark Configuration
spark:
  app_name: "ETL_Loading_Module"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"

# Loading Configuration
loading:
  batch_size: 1000
  target_format: "parquet"
  target_table: "etl_target_data"
  target_path: "/tmp/etl_target"
  enable_reconciliation: true
  
# Mode Configuration
modes:
  default: "UPSERT"
  available:
    - "INSERT"
    - "UPDATE"
    - "UPSERT"

# Performance Tuning
performance:
  max_partitions: 50
  min_partition_size_mb: 128
  compression: "snappy"
  write_mode: "append"

# Error Handling
error_handling:
  max_retries: 3
  retry_delay_seconds: 5
  log_errors: true
  continue_on_error: false

# Reconciliation
reconciliation:
  enabled: true
  tolerance_percentage: 0.01
  sample_size: 1000

# Monitoring
monitoring:
  log_level: "INFO"
  metrics_enabled: true
  alert_on_failure: true