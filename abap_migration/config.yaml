# ETL Monitoring Configuration

monitoring:
  # Dashboard settings
  dashboard:
    default_days_back: 7
    refresh_interval_seconds: 300
    
  # Performance metrics
  performance:
    metrics_retention_days: 30
    throughput_threshold: 100.0  # records per second
    duration_threshold_seconds: 3600
    
  # Health checks
  health:
    max_running_jobs: 5
    error_rate_warning_threshold: 20.0
    error_rate_critical_threshold: 50.0
    check_interval_seconds: 60
    
  # Alerting
  alerts:
    enabled: true
    severity_levels:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    notification_channels:
      email: "admin@example.com"
      slack_webhook: ""
      
  # Trend analysis
  trends:
    moving_average_window: 7
    analysis_days: 30
    
# Data sources
data_sources:
  run_log:
    format: parquet
    path: data/run_log
    partition_by: date
    
  error_log:
    format: parquet
    path: data/error_log
    partition_by: date
    
# Spark configuration
spark:
  app_name: "ETL_Monitoring"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    
# Logging
logging:
  level: INFO
  format: "[%(asctime)s] %(levelname)s: %(name)s - %(message)s"
  file: logs/etl_monitor.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Report generation
reports:
  output_directory: reports
  formats:
    - json
    - html
  schedule:
    daily: "02:00"
    weekly: "Sunday 03:00"