# Data Quality Configuration

quality:
  # Quality check thresholds
  thresholds:
    completeness_min: 0.95  # 95% completeness required
    uniqueness_min: 0.99    # 99% unique IDs required
    validity_min: 0.98      # 98% valid values required
    consistency_min: 0.97   # 97% consistent data required
    acceptable_loss_rate: 0.05  # 5% record loss acceptable
  
  # Profiling settings
  profiling:
    enabled: true
    sample_size: 10000  # For large datasets, sample for profiling
    calculate_std_dev: true
    detect_outliers: true
    outlier_std_threshold: 3  # Number of std deviations for outlier detection
  
  # Anomaly detection settings
  anomaly_detection:
    enabled: true
    check_patterns:
      - duplicate_names
      - suspicious_ids
      - outlier_values
      - category_distribution
    
    category_dominance_threshold: 0.80  # Flag if one category > 80%
    
  # Validation rules
  validation_rules:
    required_fields:
      - id
      - name
      - value
      - category
      - status
    
    value_ranges:
      value:
        min: 0
        max: 999999
      priority:
        min: 1
        max: 5
      transformed_value:
        min: 0
        max: 999999
    
    valid_statuses:
      - ACTIVE
      - INACTIVE
      - PENDING
      - TRANSFORMED
      - HIGH_VALUE
      - MEDIUM_VALUE
      - LOW_VALUE
      - NORMAL
      - INVALID
    
    valid_categories:
      - PREMIUM
      - STANDARD
      - BASIC
      - VIP
      - TRIAL
      - TEST
      - UNCATEGORIZED
  
  # Record count validation
  count_validation:
    enabled: true
    compare_stages:
      - extract_to_transform
      - transform_to_load
    max_loss_rate: 0.05  # 5%
    alert_on_mismatch: true

# Reporting settings
reporting:
  generate_report: true
  report_format: json
  include_profile: true
  include_anomalies: true
  include_samples: false
  sample_size: 10
  
  export:
    enabled: true
    path: "quality_reports/"
    file_pattern: "quality_report_{run_id}_{timestamp}.json"

# Logging
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    console:
      enabled: true
      level: INFO
    
    file:
      enabled: true
      level: DEBUG
      path: "logs/"
      file_pattern: "quality_{run_id}.log"

# Spark configuration
spark:
  app_name: "ETL Data Quality"
  master: "local[*]"
  
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "2g"
    spark.driver.memory: "1g"