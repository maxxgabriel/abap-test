# ETL Configuration
# Centralized configuration for PySpark ETL pipeline

spark:
  app_name: "ETL_Pipeline"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true

database:
  source:
    type: "jdbc"
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    user: "etl_user"
    password: "${DB_PASSWORD}"  # Use environment variable
    table: "zetl_source_data"
    
  target:
    type: "jdbc"
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    user: "etl_user"
    password: "${DB_PASSWORD}"
    table: "zetl_target_data"
    
  staging:
    type: "jdbc"
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    table: "zetl_staging"

extraction:
  source_type: "DATABASE"  # DATABASE, STAGING, INCREMENTAL
  default_filter: null
  max_records: 0  # 0 = unlimited
  fetch_size: 1000

transformation:
  # Category multipliers
  category_multipliers:
    PREMIUM: 1.5
    VIP: 2.0
    STANDARD: 1.2
    BASIC: 1.0
    DEFAULT: 1.1
  
  # Priority thresholds
  priority_thresholds:
    high_value: 1000
    medium_value: 500
    low_value: 200
  
  # Status thresholds
  status_thresholds:
    high: 750
    medium: 300
  
  # Validation rules
  validation:
    required_fields:
      - id
      - name
      - value
    value_min: 0
    priority_min: 1
    priority_max: 5

loading:
  target_type: "DATABASE"
  batch_size: 1000
  mode: "UPSERT"  # INSERT, UPDATE, UPSERT
  enable_reconciliation: true
  write_mode: "append"  # append, overwrite

business_rules:
  premium_boost: 1.2
  high_value_priority: 1
  normalize_whitespace: true
  default_category: "UNCATEGORIZED"

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_pipeline.log"
  console: true

monitoring:
  enabled: true
  metrics_interval: 60  # seconds
  health_check_interval: 300  # seconds
  alert_email: "admin@example.com"
  error_rate_threshold: 20  # percentage

performance:
  parallel_jobs: 4
  retry_attempts: 3
  retry_delay: 5  # seconds
  timeout: 3600  # seconds

data_quality:
  enabled: true
  checks:
    - completeness
    - uniqueness
    - validity
    - consistency
  failure_threshold: 5  # percentage