# PySpark Data Quality Framework Configuration

spark:
  app_name: "ETL_Data_Quality_Framework"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.sql.sources.partitionOverwriteMode: "dynamic"

# Data Quality Configuration
quality:
  # Required fields that must not be null or empty
  required_fields:
    - id
    - name
    - value
  
  # Fields that must be unique
  unique_keys:
    - id
  
  # Valid value ranges for numeric fields
  value_ranges:
    value:
      min: 0
      max: 999999
    transformed_value:
      min: 0
      max: 999999
    priority:
      min: 1
      max: 5
  
  # Business rules configuration
  business_rules:
    # Premium category minimum value threshold
    premium_min_value: 500
    
    # Allowed status values
    allowed_statuses:
      - ACTIVE
      - TRANSFORMED
      - HIGH_VALUE
      - MEDIUM_VALUE
      - LOW_VALUE
      - NORMAL
      - INVALID
    
    # Invalid name pattern (regex)
    invalid_name_pattern: '[^A-Za-z0-9\s\-_.]'
    
    # Category-specific rules
    category_rules:
      PREMIUM:
        min_value: 500
        priority_range: [1, 3]
      VIP:
        min_value: 750
        priority_range: [1, 2]
      STANDARD:
        min_value: 100
        priority_range: [2, 4]
      BASIC:
        min_value: 50
        priority_range: [3, 5]
  
  # Anomaly detection thresholds
  anomaly_detection:
    outlier_iqr_multiplier: 1.5
    skew_threshold: 0.5  # 50% of data in one category
    enable_outlier_detection: true
    enable_distribution_analysis: true

# ETL Configuration
etl:
  source_type: "DATABASE"
  target_type: "DATABASE"
  batch_size: 1000
  max_retries: 3
  enable_reconciliation: true
  
# Paths
paths:
  input_data: "data/input"
  output_data: "data/output"
  quality_reports: "data/quality_reports"
  failed_records: "data/failed_records"
  logs: "logs"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/data_quality.log"
  console_output: true

# Data Schema
schema:
  transformed_data:
    id: string
    name: string
    value: decimal(15,2)
    transformed_value: decimal(15,2)
    status: string
    category: string
    priority: integer
    etl_run_id: string
    processed_at: timestamp
    processed_by: string

# Report Configuration
reporting:
  generate_html_report: true
  generate_json_report: true
  save_failed_records: true
  email_notifications: false
  alert_on_failure: true
  failure_threshold: 0.1  # Alert if >10% checks fail