# ETL Configuration File

# Source Configuration
source:
  system_name: "SAP_ERP"
  
  database:
    path: "data/source/etl_source_data"
    format: "parquet"
    
  staging:
    path: "data/staging/etl_staging"
    format: "parquet"

# Target Configuration
target:
  database:
    path: "data/target/etl_target_data"
    format: "parquet"

# Transformation Configuration
transformation:
  # Value multipliers by category
  value_multipliers:
    PREMIUM: 1.5
    VIP: 2.0
    STANDARD: 1.2
    BASIC: 1.0
    TRIAL: 0.8
  
  # Valid categories
  valid_categories:
    - PREMIUM
    - VIP
    - STANDARD
    - BASIC
    - TRIAL
  
  # Premium bonus settings
  premium_bonus_enabled: true
  premium_bonus: 0.2
  
  # Priority thresholds
  priority_thresholds:
    critical: 1000
    high: 750
    medium: 300
    low: 100
  
  # Outlier detection
  flag_outliers: true
  max_value_threshold: 10000

# Loading Configuration
loading:
  batch_size: 1000
  enable_reconciliation: true
  mode: "upsert"  # insert, update, upsert

# Metadata Configuration
metadata:
  run_log_path: "data/metadata/run_log"
  error_log_path: "data/metadata/error_log"

# Data Quality Configuration
data_quality:
  enable_checks: true
  checks:
    completeness: true
    uniqueness: true
    validity: true
    consistency: true
  
  # Profiling settings
  enable_profiling: true
  enable_anomaly_detection: true
  std_deviation_threshold: 3.0

# Performance Configuration
performance:
  shuffle_partitions: 200
  default_parallelism: 8
  max_records_per_partition: 100000

# Monitoring Configuration
monitoring:
  enable_monitoring: true
  dashboard_retention_days: 30
  alert_email: "admin@example.com"
  alert_on_failure: true

# Spark Configuration
spark:
  app_name: "ETL_Transformation_Engine"
  master: "local[*]"
  log_level: "INFO"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"