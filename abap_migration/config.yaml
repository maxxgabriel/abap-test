# PySpark ETL Logger Configuration

# Application Settings
application:
  name: "PySpark ETL Logger"
  version: "1.0.0"
  environment: "development"

# Logging Configuration
logging:
  # Log levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
  default_level: "INFO"
  
  # Console output settings
  console:
    enabled: true
    format: "[%(asctime)s] %(levelname)s: %(message)s"
    date_format: "%Y-%m-%d %H:%M:%S"
  
  # In-memory storage settings
  memory:
    enabled: true
    max_entries: 10000  # Maximum number of log entries to keep in memory
    retention_hours: 24  # Auto-clear logs older than this
  
  # Log components
  components:
    - "EXTRACTOR"
    - "TRANSFORMER"
    - "LOADER"
    - "VALIDATOR"
    - "ORCHESTRATOR"
    - "DATA_QUALITY"
    - "MONITOR"

# ETL Process Configuration
etl:
  # Extraction settings
  extraction:
    source_type: "database"
    max_records: 0  # 0 means no limit
    batch_size: 1000
    timeout_seconds: 300
  
  # Transformation settings
  transformation:
    enable_validation: true
    enable_enrichment: true
    apply_business_rules: true
  
  # Loading settings
  loading:
    target_type: "database"
    batch_size: 1000
    mode: "upsert"  # insert, update, upsert
    enable_reconciliation: true
    max_retries: 3

# Spark Configuration
spark:
  app_name: "ETL_Logger_Application"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"
    spark.sql.session.timeZone: "UTC"
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"
    spark.sql.shuffle.partitions: "200"

# Performance Monitoring
monitoring:
  enabled: true
  metrics:
    - "execution_time"
    - "record_count"
    - "error_rate"
    - "throughput"
  
  alerts:
    error_rate_threshold: 0.05  # 5%
    execution_time_threshold_minutes: 60
    
  dashboard:
    refresh_interval_seconds: 60
    retention_days: 30

# Data Quality Checks
data_quality:
  enabled: true
  checks:
    - name: "completeness"
      enabled: true
      threshold: 0.95
    - name: "uniqueness"
      enabled: true
      threshold: 1.0
    - name: "validity"
      enabled: true
      threshold: 0.98
    - name: "consistency"
      enabled: true
      threshold: 0.99
  
  anomaly_detection:
    enabled: true
    method: "statistical"  # statistical, ml
    sensitivity: "medium"  # low, medium, high

# Error Handling
error_handling:
  max_retries: 3
  retry_delay_seconds: 5
  retry_backoff_multiplier: 2
  fail_on_error: false
  log_stack_trace: true
  
  notification:
    enabled: true
    channels:
      - "email"
      - "log"
    email:
      recipients:
        - "admin@example.com"
      smtp_server: "smtp.example.com"
      smtp_port: 587

# Test Mode Settings
test_mode:
  enabled: false
  sample_size: 100
  commit_enabled: false
  verbose_logging: true