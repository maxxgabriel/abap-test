# PySpark ETL Configuration

# Spark Configuration
spark:
  app_name: "ETL_Data_Pipeline"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.sql.debug.maxToStringFields: "100"

# Database Configuration
database:
  url: "jdbc:postgresql://localhost:5432/etl_db"
  user: "etl_user"
  password: "${DB_PASSWORD}"  # Use environment variable
  driver: "org.postgresql.Driver"
  source_table: "etl_source_data"
  target_table: "etl_target_data"
  run_log_table: "etl_run_log"

# Staging Configuration
staging:
  path: "/data/staging"
  format: "parquet"
  compression: "snappy"

# Loading Configuration
loading:
  batch_size: 1000
  mode: "upsert"  # append, overwrite, upsert
  enable_reconciliation: true

# Business Rules
business_rules:
  premium_multiplier: 1.5
  standard_multiplier: 1.2
  vip_multiplier: 2.0
  high_value_threshold: 750
  medium_value_threshold: 300
  critical_value_threshold: 1000

# Processing Configuration
processing:
  user: "etl_system"
  max_retries: 3
  retry_delay_seconds: 60

# Data Quality
data_quality:
  enable_validation: true
  enable_profiling: true
  enable_anomaly_detection: false
  completeness_threshold: 0.95
  uniqueness_threshold: 1.0

# Monitoring
monitoring:
  enable_metrics: true
  enable_alerts: true
  alert_email: "admin@example.com"
  log_level: "INFO"
  retention_days: 90

# Performance
performance:
  enable_caching: true
  repartition_size: 200
  broadcast_threshold: "10MB"